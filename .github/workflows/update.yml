name: Cập nhật kết quả và đăng trang

on:
  schedule:
    # 16:50 và 18:30 giờ Việt Nam (XSMN quay lúc 16:15)
    - cron: "50 9 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tải kết quả mới
        run: python scrape.py

      - name: Lưu dữ liệu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Cập nhật kết quả $(TZ=Asia/Ho_Chi_Minh date +%F)" && git push)

      - name: Tạo dữ liệu trang
        run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
